server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    default_type application/json;
    return 501 '{"ok":false,"message":"Native KiCad/CAM actions are not available in the web container."}';
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
